# Shared build steps for every Bastion OS variant.
# Each recipe pulls this in with "from-file: common.yml".
modules:
  # Host packages. Keep this list short: security tools belong in the
  # Kali container, not on the host that anti-cheat inspects.
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        - nmap
        - tmux
        # Bastion HUD, built by the bastion-hud repository.
        - https://github.com/seabastien/bastion-hud/releases/download/latest/bastion-hud.x86_64.rpm

  # Adds the "ujust setup-kali" and "ujust kali" commands.
  - type: justfiles
    include:
      - bastion.just

  # Apps installed for every user on first boot.
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        repo:
          title: Flathub (system)
        install:
          - com.github.tchx84.Flatseal

  # Sets up image signature verification on the installed system.
  - type: signing

   # Branding: the name shown by the system, the HUD and fastfetch.
  - type: os-release
    properties:
      NAME: Bastion
      PRETTY_NAME: Bastion (based on Bazzite)
      DEFAULT_HOSTNAME: bastion

  # Branding: copy the Bastion banner into the image.
  - type: files
    files:
      - source: system
        destination: /

  # Branding: point image-info.json at the Bastion image.
  - type: script
    scripts:
      - bastion-image-info.sh
